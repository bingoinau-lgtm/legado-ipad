packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.11.3
name: LegadoiPad
options:
  bundleIdPrefix: com.bingoinau
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LegadoiPad:
    type: application
    platform: iOS
    sources:
      - path: LegadoiPad
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bingoinau.legadoipad
        INFOPLIST_FILE: LegadoiPad/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_XR_DESIGNED_FOR_IPAD: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        TARGETED_DEVICE_FAMILY: "2"
        TARGETED_DEVICE_FAMILY[sdk=iphoneos*]: "2"
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSRequiresIPhoneOS: false
schemes:
  LegadoiPad:
    build:
      targets:
        LegadoiPad: all
    run:
      config: Debug
    archive:
      config: Release
